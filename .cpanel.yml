---
deployment:
  tasks:
    # Deploy into the yeni.ceng.az subdomain document root.
    # (Adjust DEPLOYPATH if you set a different document root when creating the subdomain.)
    - export DEPLOYPATH=/home/ceng/yeni.ceng.az/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R * $DEPLOYPATH
    - /bin/cp -f .htaccess $DEPLOYPATH
