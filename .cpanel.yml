---
deployment:
  tasks:
    # Deploy into the MAIN domain document root (ceng.az).
    # Uses cp (no delete), so it overlays files without touching anything else.
    - export DEPLOYPATH=/home/ceng/public_html/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R * $DEPLOYPATH
    - /bin/cp -f .htaccess $DEPLOYPATH
